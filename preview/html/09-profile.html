<!DOCTYPE html><html><head><meta charset="utf-8" /><style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #E9E4DA; display: flex; justify-content: center; padding: 0; }
.phone {
  width: 390px; height: 844px; background: #FDFBF7; position: relative;
  display: flex; flex-direction: column; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.phone__nav {
  height: 88px; padding-top: 44px; display: flex; align-items: center; justify-content: center;
  background: #FDFBF7; border-bottom: 1px solid rgba(0,0,0,0.02); position: relative; flex: none;
}
.phone__nav-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
.phone__nav-back { position: absolute; left: 14px; top: 48px; font-size: 15px; color: #333; }
.phone__scroll { flex: 1; overflow-y: auto; }
.phone__tabbar {
  height: 74px; border-top: 1px solid #F0EBE1; background: #fff; display: flex; flex: none;
  padding-bottom: 12px;
}
.phone__tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.phone__tab img { width: 24px; height: 24px; }
.phone__tab span { font-size: 10px; color: #9A958B; }
.phone__tab--active span { color: #8A6A46; }
/* 小学英语语法 · 小程序基础样式
   配色取自网页版：米白纸感底 + 墨黑正文 + 琥珀金强调。 */
.page-body {
  background: #FDFBF7;
  color: #222222;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

view, text, scroll-view, button, input {
  box-sizing: border-box;
}

.page {
  min-height: 100vh;
  padding: 12px 16px 32px;
}

/* ---------- 排版 ---------- */
.eyebrow {
  font-size: 10px;
  line-height: 1.4;
  letter-spacing: 2px;
  font-weight: 600;
  color: #A2967F;
  text-transform: uppercase;
}

.serif {
  font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
}

.title {
  font-size: 22px;
  line-height: 1.3;
  font-weight: 700;
  color: #222222;
  letter-spacing: -0.25px;
}

.title-sm {
  font-size: 17px;
  line-height: 1.4;
  font-weight: 700;
  color: #222222;
}

.muted {
  color: #6F6B63;
}

.small {
  font-size: 12px;
}

.tiny {
  font-size: 11px;
}

.gold {
  color: #8A6A46;
}

/* ---------- 卡片 ---------- */
.card {
  background: #FFFFFF;
  border: 0.5px solid #EFE9DD;
  border-radius: 14px;
  padding: 16px;
}

.card--soft {
  background: #F7F3EA;
  border-color: #EDE4D3;
}

.card--flat {
  box-shadow: 0 1px 0 rgba(34, 34, 34, 0.02);
}

.card + .card {
  margin-top: 12px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 2px 10px;
}

.section-head__title {
  font-size: 15px;
  font-weight: 700;
  color: #222222;
}

.section-head__note {
  font-size: 11px;
  color: #9A8F7C;
}

/* ---------- 按钮 ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  padding: 0 18px;
  border-radius: 499.5px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  border: none;
}

.btn::after {
  border: none;
}

.btn--primary {
  background: #2E2A26;
  color: #FFFFFF;
}

.btn--primary.btn--hover,
.btn--primary:active {
  background: #4A3E2C;
}

.btn--gold {
  background: #8A6A46;
  color: #FFFFFF;
}

.btn--ghost {
  background: #FFFFFF;
  color: #2E2A26;
  border: 0.5px solid #DCD2C0;
}

.btn--ghost:active {
  background: #F5F3EE;
}

.btn--sm {
  height: 34px;
  padding: 0 14px;
  font-size: 13px;
}

.btn--block {
  width: 100%;
}

.btn[disabled] {
  background: #E7E2D7;
  color: #A39C8F;
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn-row .btn {
  flex: 1;
}

/* ---------- 标签 ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 499.5px;
  font-size: 11px;
  font-weight: 600;
  color: #6F6B63;
  background: #F5F3EE;
}

.pill--gold {
  color: #7A5C33;
  background: #F4E9D6;
}

.pill--green {
  color: #37634A;
  background: #E9F1E7;
}

.pill--red {
  color: #9E403C;
  background: #FBEAE8;
}

.pill--outline {
  background: transparent;
  border: 0.5px solid #E0D7C6;
}

/* ---------- 进度条 ---------- */
.progress {
  height: 6px;
  border-radius: 499.5px;
  background: #EFE9DD;
  overflow: hidden;
}

.progress__bar {
  height: 100%;
  border-radius: 499.5px;
  background: #B9975B;
}

/* ---------- 通用 ---------- */
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.row--between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.stack-8 > view + view {
  margin-top: 4px;
}

.divider {
  height: 0.5px;
  background: #F0EBE1;
  margin: 12px 0;
}

.link {
  color: #8A6A46;
  font-weight: 600;
}

.empty {
  padding: 40px 16px;
  text-align: center;
  color: #9A8F7C;
}

.empty__title {
  font-size: 15px;
  color: #4A443C;
  font-weight: 600;
  margin-bottom: 6px;
}

.safe-bottom {
  height: 0px;
}
.me {
  padding-top: 10px;
}

.me-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 2px 15px;
}

.me-avatar {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #F4E9D6;
  position: relative;
  padding: 0;
  margin: 0;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  border: none;
}

.me-avatar::after {
  border: none;
}

.me-avatar__img {
  width: 62px;
  height: 62px;
  border-radius: 50%;
}

.me-avatar__emoji {
  font-size: 26px;
  line-height: 1;
}

.me-avatar__badge {
  position: absolute;
  right: -2px;
  bottom: -1px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #2E2A26;
  color: #FBF6EC;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #FDFBF7;
}

.me-hero__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.me-name {
  font-size: 21px;
  font-weight: 700;
  color: #222222;
  height: 29px;
  line-height: 29px;
  border: none;
  outline: none;
  background: transparent;
  padding: 0;
}

.me-name__ph {
  color: #C0B5A3;
  font-weight: 600;
}

.me-hero__sub {
  font-size: 10.5px;
  color: #9A8F7C;
}

.me-phone {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 13px 13px;
  border-radius: 12px;
  background: #FFFFFF;
  border: 0.5px solid #EFE9DD;
}

.me-phone__icon {
  width: 29px;
  height: 29px;
  border-radius: 8px;
  background: #F5F1E6;
  color: #8A6A46;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.me-phone__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.me-phone__row {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.me-phone__title {
  font-size: 13.5px;
  font-weight: 600;
  color: #2E2A26;
}

.me-phone__value {
  font-size: 12px;
  color: #A99C88;
}

.me-phone__value--on {
  color: #37634A;
}

.me-phone__desc {
  font-size: 10px;
  color: #A99C88;
  line-height: 1.5;
}

.me-phone__btn {
  height: 31px;
  line-height: 31px;
  padding: 0 14px;
  border-radius: 499.5px;
  background: #2E2A26;
  color: #FBF6EC;
  font-size: 12px;
  font-weight: 600;
  margin: 0;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.me-phone__btn::after {
  border: none;
}

.me-phone__unbind {
  font-size: 11px;
  color: #A99C88;
  padding: 6px 2px;
  flex: none;
}

.me-stats {
  display: flex;
  margin-top: 12px;
  padding: 14px 10px;
}

.me-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.me-stat__num {
  font-size: 20px;
  font-weight: 700;
  color: #2E2A26;
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1;
}

.me-stat__label {
  font-size: 10px;
  color: #9A8F7C;
}

.users {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 33px;
  padding: 0 12px;
  border-radius: 499.5px;
  background: #FFFFFF;
  border: 0.5px solid #E7E2D7;
  font-size: 12.5px;
  color: #5F594F;
}

.user-chip--on {
  background: #2E2A26;
  border-color: #2E2A26;
  color: #FBF6EC;
}

.user-chip__emoji {
  font-size: 13px;
}

.user-chip--add {
  border-style: dashed;
  color: #8A6A46;
}

.entries {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 17px;
}

.entry {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 14px;
  background: #FFFFFF;
  border: 0.5px solid #EFE9DD;
  border-radius: 12px;
}

.entry:active {
  background: #F9F6EF;
}

.entry__icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: #F5F1E6;
  color: #8A6A46;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.entry__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.entry__title {
  font-size: 14.5px;
  font-weight: 600;
  color: #222222;
}

.entry__desc {
  font-size: 11px;
  color: #9A8F7C;
}

.entry__arrow {
  color: #C0B5A3;
  font-size: 14px;
}

.me-remove {
  margin-top: 20px;
  text-align: center;
}

.me-remove text {
  font-size: 11px;
  color: #B08783;
}

.me-foot {
  display: block;
  margin-top: 15px;
  text-align: center;
  font-size: 10px;
  color: #B3AEA4;
  line-height: 1.6;
}
</style></head><body><div class="phone"><div class="phone__nav"><div class="phone__nav-title">我的</div></div><div class="phone__scroll"><div class="page-body"><div class="page me">
  <div class="me-hero">
    <button class="me-avatar">
      
      <span class="me-avatar__emoji">🦊</span>
      <span class="me-avatar__badge">换</span>
    </button>
    <div class="me-hero__body">
      <input class="me-name" value="小语"></input>
      <span class="me-hero__sub">一台手机一位学员 · 数据只存在这台手机</span>
    </div>
  </div>

  <div class="me-phone">
    <div class="me-phone__icon">微</div>
    <div class="me-phone__body">
      <div class="me-phone__row">
        <span class="me-phone__title">账号</span>
        <span class="me-phone__value ">本机模式</span>
      </div>
      <span class="me-phone__desc">还没开通云开发，学习记录只保存在这台手机</span>
    </div>
    
  </div>

  <div class="card me-stats">
    <div class="me-stat">
      <span class="me-stat__num">80</span>
      <span class="me-stat__label">积分</span>
    </div>
    <div class="me-stat">
      <span class="me-stat__num">4</span>
      <span class="me-stat__label">通关 / 37</span>
    </div>
    <div class="me-stat">
      <span class="me-stat__num">30</span>
      <span class="me-stat__label">累计作答</span>
    </div>
    <div class="me-stat">
      <span class="me-stat__num">9</span>
      <span class="me-stat__label">待巩固</span>
    </div>
  </div>

  <div class="entries">
    <div class="entry">
      <div class="entry__icon">榜</div>
      <div class="entry__body">
        <span class="entry__title">积分排行榜</span>
        <span class="entry__desc">我的积分 · 班级榜</span>
      </div>
      <span class="entry__arrow">→</span>
    </div>
    <div class="entry">
      <div class="entry__icon">长</div>
      <div class="entry__body">
        <span class="entry__title">成长记录</span>
        <span class="entry__desc">积分、徽章与六册进度</span>
      </div>
      <span class="entry__arrow">→</span>
    </div>
    <div class="entry">
      <div class="entry__icon">问</div>
      <div class="entry__body">
        <span class="entry__title">数据存在哪</span>
        <span class="entry__desc">本机保存与云端同步的范围</span>
      </div>
      <span class="entry__arrow">→</span>
    </div>
  </div>

  <span class="me-foot">题库随包下发，不联网也能练 · 开通云开发后自动用微信登录同步</span>
</div>
</div></div><div class="phone__tabbar"><div class="phone__tab "><img src="file://E:/primary-english-grammar-miniprogram/images/tab-home.png" /><span>学习台</span></div><div class="phone__tab "><img src="file://E:/primary-english-grammar-miniprogram/images/tab-map.png" /><span>语法地图</span></div><div class="phone__tab "><img src="file://E:/primary-english-grammar-miniprogram/images/tab-mistakes.png" /><span>错题本</span></div><div class="phone__tab "><img src="file://E:/primary-english-grammar-miniprogram/images/tab-growth.png" /><span>成长</span></div><div class="phone__tab phone__tab--active"><img src="file://E:/primary-english-grammar-miniprogram/images/tab-me.png" /><span>我的</span></div></div></div></body></html>
